<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet" href="../style.css">

<style>

body{
    background:#f5f5f5;
    font-family:Arial, Helvetica, sans-serif;
}

.dashboard{
    width:95%;
    margin:120px auto;
}

.dashboard h1{
    text-align:center;
    color:#00695c;
    margin-bottom:30px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
}

th{
    background:#00695c;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

tr:hover{
    background:#f8f8f8;
}

button{
    padding:8px 15px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.edit{
    background:orange;
    color:white;
}

.delete{
    background:red;
    color:white;
}

</style>

</head>

<body>

<div class="dashboard">

<h1>DARIUS DEEDEA TOUR GUIDE</h1>

<h2 style="text-align:center;">Bookings Dashboard</h2>

<table>

<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Phone</th>

<th>Destination</th>

<th>Date</th>

<th>Guests</th>

<th>Status</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="bookingTable">

</tbody>

</table>

</div>

<script>

fetch("/bookings")

.then(response=>response.json())

.then(data=>{

let table="";

data.forEach(booking=>{

table += `

<tr>

<td>${booking.id}</td>

<td>${booking.fullname}</td>

<td>${booking.phone}</td>

<td>${booking.destination}</td>

<td>${booking.travelDate}</td>

<td>${booking.guests}</td>

<td>Pending</td>

<td>

<button class="edit">Approve</button>

<button class="delete">Delete</button>

</td>

</tr>

`;

});

document.getElementById("bookingTable").innerHTML=table;

});

</script>

</body>

</html>
