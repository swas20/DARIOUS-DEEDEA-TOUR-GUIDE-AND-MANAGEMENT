<section class="booking-page">

<div class="container">

<h1>Book Your Tour</h1>

<p>Complete the form below and we'll contact you to confirm your booking.</p>
<form class="booking-form" action="/book" method="POST">

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email Address" required>

<input type="tel" placeholder="Phone Number" required>

<select required>

<option value="">Select Destination</option>

<option>Diani Beach</option>

<option>Maasai Mara</option>

<option>Mount Kenya</option>

<option>Lamu Island</option>

<option>Watamu</option>

<option>Amboseli National Park</option>

<option>Luxury Yacht Ride</option>

<option>Luxury Airbnb</option>

</select>

<input type="date" required>

<input type="number" placeholder="Number of People" min="1" required>

<textarea rows="6" placeholder="Additional Information"></textarea>

<button type="submit" class="btn">

Book Now

</button>

</form>
